<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كتالوج المنتجات</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">كتالوج المنتجات</p>
        <h1>المنتجات</h1>
        <p class="page-subtitle">تصفّح حسب الماركة وتصنيف المنتج، وابحث بالاسم أو بالرمز.</p>
      </div>
      <div class="view-switch" role="group" aria-label="طريقة العرض">
        <button type="button" class="view-btn is-active" data-view="table">جدول</button>
        <button type="button" class="view-btn" data-view="cards">كروت</button>
      </div>
    </header>

    <main id="app">
      <div class="state-panel">جارٍ تحميل البيانات...</div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/components.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>

</html>
